name: Test selection artifact consumer proof
on:
  workflow_run:
    workflows: [Test selection artifact proof]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  consume:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler: '4.0.23'
      - name: Prepare dependencies from repository lock
        run: ruby script/ci/artifact_round_trip_lab.rb bundle
      - name: Install locked fixture dependencies
        env:
          BUNDLE_GEMFILE: ${{ runner.temp }}/test-selection-artifact-bundle/Gemfile
        run: bundle install
      - name: Download, validate, select and execute
        env:
          BUNDLE_GEMFILE: ${{ runner.temp }}/test-selection-artifact-bundle/Gemfile
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bundle exec ruby script/ci/artifact_round_trip_lab.rb consume
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifact-round-trip-proof
          path: ${{ runner.temp }}/test-selection-artifact-fixture/tmp/
          if-no-files-found: warn
